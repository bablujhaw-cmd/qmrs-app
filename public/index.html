<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - QMRS Portal</title>
  <link rel="stylesheet" href="/assets/css/common.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your portal account</p>
      </div>

      <div id="alertBox" class="alert" style="display: none;"></div>

      <form id="loginForm" method="POST" action="/api/auth/login.php">
        <div class="form-group">
          <label for="username">Username / Mobile</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="Enter username or mobile" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">
          <span>Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/public/register.php">Create an Account</a>
      </div>
    </div>
  </div>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QMRS Forgot Password</title><link rel="stylesheet" href="/assets/css/common.css"></head><body><header><div class="container nav"><a class="brand" href="/"><span class="mark"><i></i><i></i><i></i></span><span><b>QMRS</b><small>Trusted Jobs. Verified People.</small></span></a><div class="member"><a href="/login/">Sign In</a></div></div></header><main class="page"><section class="card"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Forgot your password?</h1><p class="intro">Enter your email or mobile number.</p><form id="f"><label class="field">Email or Mobile<input name="identity" required></label><button class="submit">SEND VERIFICATION CODE</button></form><p class="footer"><a href="/login/">Back to Sign In</a></p></section></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/forgot-password.php',{method:'POST',body:new FormData(f)}),j=await r.json();alert(j.message+(j.data?.development_otp?'\nDevelopment OTP: '+j.data.development_otp:''))}</script></body></html>

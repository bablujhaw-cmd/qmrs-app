<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QMRS OTP</title><link rel="stylesheet" href="/assets/css/common.css"></head><body><header><div class="container nav"><a class="brand" href="/"><span class="mark"><i></i><i></i><i></i></span><span><b>QMRS</b><small>Trusted Jobs. Verified People.</small></span></a><div class="member"><a href="/login/">Sign In</a></div></div></header><main class="page"><section class="card"><span class="eyebrow">ACCOUNT VERIFICATION</span><h1>Verify your account</h1><p class="intro">Enter the 6-digit code sent to your registered contact.</p><form id="f"><label class="field">Verification Code<input name="otp" inputmode="numeric" maxlength="6" required></label><button class="submit">VERIFY ACCOUNT</button></form></section></main><script>f.onsubmit=async e=>{e.preventDefault();let p=new URLSearchParams(location.search),d=new FormData(f);d.append('user_id',p.get('user_id')||'');d.append('otp_type',p.get('otp_type')||'EMAIL');let r=await fetch('/api/auth/verify-otp.php',{method:'POST',body:d}),j=await r.json();alert(j.message);if(j.success)location='/login/'}</script></body></html>

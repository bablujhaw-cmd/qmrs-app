<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QMRS Login</title><link rel="stylesheet" href="/assets/css/common.css"></head><body><header><div class="container nav"><a class="brand" href="/"><span class="mark"><i></i><i></i><i></i></span><span><b>QMRS</b><small>Trusted Jobs. Verified People.</small></span></a><div class="member">Don't have an account? <a href="/register/">Register</a></div></div></header><main class="page"><section class="card"><span class="eyebrow">SECURE LOGIN</span><h1>Welcome back.</h1><p class="intro">Sign in to continue.</p><form id="f"><label class="field">Email or Mobile<input name="identity" required></label><label class="field">Password<input name="password" type="password" required></label><p style="text-align:right;font-size:9px"><a href="/forgot-password/">Forgot Password?</a></p><button class="submit">LOGIN SECURELY</button></form></section></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/login.php',{method:'POST',body:new FormData(f)}),j=await r.json();alert(j.message);if(j.success)location='/dashboard.php'}</script></body></html>

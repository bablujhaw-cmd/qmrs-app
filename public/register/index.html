<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QMRS Registration</title><link rel="stylesheet" href="/assets/css/common.css"></head><body><header><div class="container nav"><a class="brand" href="/"><span class="mark"><i></i><i></i><i></i></span><span><b>QMRS</b><small>Trusted Jobs. Verified People.</small></span></a><div class="member">Already registered? <a href="/login/">Sign In</a></div></div></header><main class="page"><section class="card"><span class="eyebrow">CREATE ACCOUNT</span><h1>Join QMRS</h1><p class="intro">Create a verified account.</p><form id="f"><label class="field">Full Name<input name="full_name" required></label><label class="field">Email<input name="email" type="email"></label><label class="field">Country Code<input name="country_code" value="+91"></label><label class="field">Mobile<input name="mobile"></label><label class="field">Account Type<select name="user_type"><option value="CANDIDATE">Job Seeker</option><option value="EMPLOYER">Employer</option></select></label><label class="field">Password<input name="password" type="password" required></label><label class="field">Confirm Password<input name="confirm_password" type="password" required></label><label class="field"><input name="terms" value="1" type="checkbox" required> I accept Terms and Privacy.</label><button class="submit">CREATE ACCOUNT</button></form></section></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/register.php',{method:'POST',body:new FormData(f)}),j=await r.json();alert(j.message+(j.data?.development_otp?'\nDevelopment OTP: '+j.data.development_otp:''));if(j.success)location='/otp/?user_id='+j.data.user_id+'&otp_type='+j.data.otp_type}</script></body></html>
